<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random JS Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f5f5;
    }
    .app {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    button {
      cursor: pointer;
    }
    .log {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid #eee;
      padding-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Best E-Shop</h1>
    <p>This tiny app demonstrates multiple JS modules working together.</p>

    <section>
      <h2>Counter</h2>
      <div id="counter-root"></div>
    </section>

    <section>
      <h2>“API” call</h2>
      <button id="api-button">Get random quote</button>
      <p id="quote-output"><em>Click the button to get a quote.</em></p>
    </section>

    <section>
      <h2>Math utils demo</h2>
      <button id="math-button">Roll 3 dice &amp; sum</button>
      <p id="math-output"><em>Click to roll.</em></p>
    </section>

    <div class="log" id="log"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
